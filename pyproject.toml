[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "feed-seeker"
version = "2.0.0"
authors = [
    {name = "Colin Carroll", email = "ccarroll@mit.edu"},
    {name = "Jason Baumgartner"},
    {name = "Linas Valiukas"},
    {name = "Thomas Vandal"},
    {name = "Hal Roberts"},
    {name = "Rahul Bhargava"},
    {name = "Paige Gulley"},
    {name = "Phil Budne"},
]
description = "Find rss, atom, xml, and rdf feeds on webpages"
readme = "README.rst"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "beautifulsoup4>=4.6.0",
    "lxml>=4.1.1",
    "requests>=2.18.4",
    "publicsuffix2>=2.20191221",
    "urllib3>=1.24.1",
    "pytest>=8.0.0",
    "responses>=0.10.6",
    "typing>=3.6.6"
]

[project.optional-dependencies]
test = [
    "pytest", "pytest-cov"
]

[project.scripts]
feedseeker = "feed_seeker.__main__:main"


[project.urls]
Homepage = "https://mediacloud.org"
Repository = "https://github.com/mediacloud/feed_seeker"
Issues = "https://github.com/mediacloud/feed_seeker/issues"
